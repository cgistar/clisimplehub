services:
  clisimplehub-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clisimplehub-server
    ports:
      - "${PORT:-5600}:5600"
      - "${XRAY_SOCKS_PORT:-10808}:${XRAY_SOCKS_PORT:-10808}"
    environment:
      PORT: "${PORT:-5600}"
      LISTEN_ADDR: "${LISTEN_ADDR:-0.0.0.0}"
      DATA: "/data"
      XRAY_SOCKS_LISTEN: "${XRAY_SOCKS_LISTEN:-0.0.0.0}"
      XRAY_SOCKS_PORT: "${XRAY_SOCKS_PORT:-10808}"
      # API_KEY: "${API_KEY}"  # Uncomment and set your API key for authentication
    volumes:
      - ./data:/data
    restart: unless-stopped
