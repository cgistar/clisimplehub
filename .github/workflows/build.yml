name: Build and Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  WAILS_VERSION: 2.12.0

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: amd64
            desktop: true
            pr_desktop: true
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            desktop: true
            pr_desktop: false
          - os: windows-latest
            platform: windows
            arch: amd64
            desktop: true
            pr_desktop: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: go.mod

      - name: Generate go.sum
        env:
          GOFLAGS: -mod=mod
        run: |
          go mod download
          go mod verify

      - name: Setup Node.js
        if: matrix.desktop
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            desktop/ui/package-lock.json
            web/ui/package-lock.json

      - name: Install desktop UI dependencies
        if: matrix.desktop
        run: |
          cd desktop/ui
          npm ci
        shell: bash

      - name: Install web UI dependencies
        if: matrix.desktop
        run: |
          cd web/ui
          npm ci
        shell: bash

      - name: Build web UI
        if: matrix.desktop
        run: |
          cd web/ui
          npm run build
        shell: bash

      - name: Cache Wails CLI
        if: matrix.desktop
        id: cache-wails
        uses: actions/cache@v5
        with:
          path: |
            ~/go/bin/wails
            ~/go/bin/wails.exe
          key: ${{ runner.os }}-${{ runner.arch }}-wails-${{ env.WAILS_VERSION }}

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.ref_type }}" == "tag" ]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=dev-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Install Wails (Linux)
        if: matrix.desktop && matrix.platform == 'linux' && steps.cache-wails.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
          # Create webkit2gtk-4.0.pc symlink to webkit2gtk-4.1.pc in all pkg-config paths
          for pcdir in $(pkg-config --variable pc_path pkg-config | tr ':' ' '); do
            if [ -f "$pcdir/webkit2gtk-4.1.pc" ]; then
              echo "Creating symlink in $pcdir"
              sudo ln -sf "$pcdir/webkit2gtk-4.1.pc" "$pcdir/webkit2gtk-4.0.pc"
            fi
          done
          # Verify the symlink was created
          pkg-config --exists webkit2gtk-4.0 && echo "✓ webkit2gtk-4.0 found" || echo "✗ webkit2gtk-4.0 NOT found"
          pkg-config --modversion webkit2gtk-4.0 || true
          go install github.com/wailsapp/wails/v2/cmd/wails@v${WAILS_VERSION}

      - name: Install Wails (Windows)
        if: matrix.desktop && matrix.platform == 'windows' && steps.cache-wails.outputs.cache-hit != 'true'
        run: |
          go install "github.com/wailsapp/wails/v2/cmd/wails@v$env:WAILS_VERSION"
        shell: pwsh

      - name: Install Linux dependencies (cached)
        if: matrix.desktop && matrix.platform == 'linux' && steps.cache-wails.outputs.cache-hit == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
          # Create webkit2gtk-4.0.pc symlink to webkit2gtk-4.1.pc in all pkg-config paths
          for pcdir in $(pkg-config --variable pc_path pkg-config | tr ':' ' '); do
            if [ -f "$pcdir/webkit2gtk-4.1.pc" ]; then
              echo "Creating symlink in $pcdir"
              sudo ln -sf "$pcdir/webkit2gtk-4.1.pc" "$pcdir/webkit2gtk-4.0.pc"
            fi
          done
          pkg-config --exists webkit2gtk-4.0 && echo "✓ webkit2gtk-4.0 found" || echo "✗ webkit2gtk-4.0 NOT found"

      - name: Build application (Linux)
        if: matrix.desktop && matrix.platform == 'linux'
        env:
          CGO_ENABLED: 1
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          cd desktop
          echo "Checking WebKit2GTK availability..."
          pkg-config --exists webkit2gtk-4.0 && echo "✓ webkit2gtk-4.0 is available" || echo "✗ webkit2gtk-4.0 NOT available"
          pkg-config --modversion webkit2gtk-4.0 || true

          export DEB_HOST_MULTIARCH="$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
          export CGO_CFLAGS="$(pkg-config --cflags gtk+-3.0 webkit2gtk-4.0)"
          export CGO_LDFLAGS="$(pkg-config --libs gtk+-3.0 webkit2gtk-4.0)"
          export PKG_CONFIG_PATH="/usr/lib/${DEB_HOST_MULTIARCH}/pkgconfig:/usr/share/pkgconfig:${PKG_CONFIG_PATH}"

          echo "DEB_HOST_MULTIARCH: $DEB_HOST_MULTIARCH"
          echo "CGO_CFLAGS: $CGO_CFLAGS"
          echo "CGO_LDFLAGS: $CGO_LDFLAGS"

          wails build -platform ${{ matrix.platform }}/${{ matrix.arch }}
          if [ -f "build/bin/cliSimpleHub" ]; then
            echo "Desktop default binary output ready: build/bin/cliSimpleHub"
            mkdir -p ../desktop-package/default
            cp build/bin/cliSimpleHub ../desktop-package/default/cliSimpleHub
          else
            echo "Desktop build output not found for default"
            ls -la build/bin
            exit 1
          fi

          wails build -platform ${{ matrix.platform }}/${{ matrix.arch }} -tags proxy
          if [ -f "build/bin/cliSimpleHub" ]; then
            mkdir -p ../desktop-package/proxy
            cp build/bin/cliSimpleHub ../desktop-package/proxy/cliSimpleHub
          else
            echo "Desktop build output not found for proxy"
            ls -la build/bin
            exit 1
          fi

      - name: Build application (Windows)
        if: matrix.desktop && matrix.platform == 'windows'
        run: |
          $env:PATH += ";$(go env GOPATH)\bin"
          cd desktop
          wails build -platform ${{ matrix.platform }}/${{ matrix.arch }}
          if (Test-Path "build\bin\cliSimpleHub.exe") {
            Write-Output "Desktop default output ready: build\bin\cliSimpleHub.exe"
            New-Item -ItemType Directory -Force -Path "..\desktop-package\default" | Out-Null
            Copy-Item -Path "build\bin\cliSimpleHub.exe" -Destination "..\desktop-package\default\cliSimpleHub.exe" -Force
          } else {
            throw "Desktop build output not found for default"
          }
          wails build -platform ${{ matrix.platform }}/${{ matrix.arch }} -tags proxy
          if (Test-Path "build\bin\cliSimpleHub.exe") {
            New-Item -ItemType Directory -Force -Path "..\desktop-package\proxy" | Out-Null
            Copy-Item -Path "build\bin\cliSimpleHub.exe" -Destination "..\desktop-package\proxy\cliSimpleHub.exe" -Force
          } else {
            throw "Desktop build output not found for proxy"
          }
        shell: pwsh

      - name: Package application (Linux)
        if: matrix.desktop && matrix.platform == 'linux' && github.event_name != 'pull_request'
        run: |
          tar -czf cliSimpleHub-${{ steps.get_version.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz -C desktop-package/default cliSimpleHub
          tar -czf cliSimpleHub-proxy-${{ steps.get_version.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz -C desktop-package/proxy cliSimpleHub

      - name: Package application (Windows)
        if: matrix.desktop && matrix.platform == 'windows' && github.event_name != 'pull_request'
        run: |
          Compress-Archive -Path desktop-package\default\cliSimpleHub.exe -DestinationPath cliSimpleHub-${{ steps.get_version.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}.zip -Force
          Compress-Archive -Path desktop-package\proxy\cliSimpleHub.exe -DestinationPath cliSimpleHub-proxy-${{ steps.get_version.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}.zip -Force
        shell: pwsh

      - name: Upload artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: cliSimpleHub-${{ steps.get_version.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            cliSimpleHub-*.tar.gz
            cliSimpleHub-*.zip

  headless:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/ui/package-lock.json

      - name: Install web UI dependencies
        run: |
          cd web/ui
          npm ci
        shell: bash

      - name: Build web UI
        run: |
          cd web/ui
          npm run build
        shell: bash

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: go.mod

      - name: Generate go.sum
        env:
          GOFLAGS: -mod=mod
        run: |
          go mod download
          go mod verify

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.ref_type }}" == "tag" ]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=dev-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Build headless server (all targets)
        env:
          CGO_ENABLED: 0
          GOFLAGS: -mod=mod
        run: |
          set -euo pipefail
          mkdir -p dist/headless

          while read -r goos goarch; do
            [ -n "$goos" ] || continue
            ext=""
            if [ "$goos" = "windows" ]; then
              ext=".exe"
            fi

            echo "Building headless for ${goos}/${goarch}"
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags "-s -w" -o "dist/headless/cliSimpleHub-server-${goos}-${goarch}${ext}" ./cmd/server
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -tags proxy -ldflags "-s -w" -o "dist/headless/cliSimpleHub-server-proxy-${goos}-${goarch}${ext}" ./cmd/server
          done <<'EOF'
          linux amd64
          linux arm64
          freebsd amd64
          freebsd arm64
          windows amd64
          windows arm64
          darwin amd64
          darwin arm64
          EOF

      - name: Package headless server
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p dist/headless-packages

          while read -r goos goarch; do
            [ -n "$goos" ] || continue
            ext=""
            pkg_ext="tar.gz"
            if [ "$goos" = "windows" ]; then
              ext=".exe"
              pkg_ext="zip"
            fi

            for variant in server server-proxy; do
              src="dist/headless/cliSimpleHub-${variant}-${goos}-${goarch}${ext}"
              stage="$(mktemp -d)"
              package_bin="cliSimpleHub${ext}"
              cp "$src" "$stage/${package_bin}"

              if [ "$goos" = "windows" ]; then
                (
                  cd "$stage"
                  zip -q "${GITHUB_WORKSPACE}/dist/headless-packages/cliSimpleHub-${variant}-${{ steps.get_version.outputs.version }}-${goos}-${goarch}.${pkg_ext}" "${package_bin}"
                )
              else
                tar -czf "dist/headless-packages/cliSimpleHub-${variant}-${{ steps.get_version.outputs.version }}-${goos}-${goarch}.${pkg_ext}" -C "$stage" "${package_bin}"
              fi

              rm -rf "$stage"
            done
          done <<'EOF'
          linux amd64
          linux arm64
          freebsd amd64
          freebsd arm64
          windows amd64
          windows arm64
          darwin amd64
          darwin arm64
          EOF

      - name: Upload headless artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: cliSimpleHub-headless-${{ steps.get_version.outputs.version }}
          path: dist/headless-packages/*

  release:
    needs:
      - build
      - headless
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
